name: Feature request
description: Propose a feature, a knob or an architecture change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, with a number or a log line if you have one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, and which registry slot or module it belongs to.
    validations:
      required: true
